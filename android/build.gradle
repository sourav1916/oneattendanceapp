buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// @react-native-async-storage/async-storage 3.x ships storage-android in a local Maven repo (not on Maven Central).
allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}

// Windows: use Ninja 1.12+ from android/tools for long-path support (SDK ships 1.10.x).
def windowsNinjaExe = new File(rootProject.rootDir, "tools/ninja.exe")
def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()

subprojects { subproject ->
    def configureWindowsCmake = {
        if (!isWindows || !windowsNinjaExe.exists()) {
            return
        }
        def hasAndroidPlugin =
            subproject.plugins.hasPlugin('com.android.library') ||
            subproject.plugins.hasPlugin('com.android.application')
        if (!hasAndroidPlugin) {
            return
        }
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt == null) {
            return
        }
        def cmake = androidExt.defaultConfig.externalNativeBuild?.cmake
        if (cmake == null) {
            return
        }

        def ninjaArg = "-DCMAKE_MAKE_PROGRAM=${windowsNinjaExe.absolutePath.replace('\\', '/')}"
        def existing = cmake.arguments?.toList() ?: []
        if (!existing.contains(ninjaArg)) {
            cmake.arguments(*((existing + [ninjaArg]) as String[]))
        }
    }
    if (subproject.state.executed) {
        configureWindowsCmake()
    } else {
        subproject.afterEvaluate(configureWindowsCmake)
    }
}